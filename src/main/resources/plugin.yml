name: EasyChat
version: '${project.version}'
main: me.pinkysha.easychat.EasyChat
api-version: '1.21.4'
author: Pinkysha
description: Multi-channel chat, colors, cooldowns, private messages and weight-based mutes.
softdepend:
  - LuckPerms
  - PlaceholderAPI
  - DiscordSRV
commands:
  easychat:
    description: EasyChat administration command
    usage: /easychat <reload|migrate>
    permission: easychat.admin
  mute:
    description: Mute a player
    usage: /mute <player> <duration|perm> [reason]
    permission: easychat.moderation.mute
  unmute:
    description: Unmute a player
    usage: /unmute <player>
    permission: easychat.moderation.unmute
  chatcolor:
    description: Set your default chat color
    aliases: [color]
    usage: /chatcolor <color|hex|reset>
    permission: easychat.chatcolor
  msg:
    description: Send a private message to a player
    aliases: [tell, w, whisper]
    usage: /msg <player> <message>
    permission: easychat.pm
  reply:
    description: Reply to the last private message
    aliases: [r]
    usage: /r <message>
    permission: easychat.pm
  msgtoggle:
    description: Toggle receiving private messages
    usage: /msgtoggle
    permission: easychat.pm.toggle
  ignore:
    description: Ignore private messages from a player
    usage: /ignore <player>
    permission: easychat.pm.ignore
permissions:
  easychat.chat.local:
    default: true
  easychat.chat.global:
    default: true
  easychat.chat.admin:
    default: op
  easychat.bypass.cooldown:
    default: op
  easychat.bypass.mute:
    default: op
  easychat.moderation.mute:
    default: op
  easychat.moderation.unmute:
    default: op
  easychat.admin:
    default: op
  easychat.chatcolor:
    description: Allows using /chatcolor command
    default: true
  easychat.pm:
    description: Allows using /msg and /r
    default: true
  easychat.pm.spy:
    description: Allows seeing social spy for private messages
    default: op
  easychat.pm.toggle:
    description: Allows toggling private messages
    default: true
  easychat.pm.ignore:
    description: Allows ignoring players in private messages
    default: true
  easychat.chat.color.*:
    description: Allows using all legacy chat colors
    default: op
  easychat.chat.color.hex:
    description: Allows using all HEX chat colors
    default: op
  easychat.chat.color.hex.*:
    description: Allows using all HEX chat colors
    default: op
  easychat.chat.style.*:
    description: Allows using all chat styles
    default: op
