database:
  file: easychat.db

placeholders:
  enabled: true
    # PlaceholderAPI must be installed. Examples: %player_name%, %vault_prefix%, %luckperms_prefix%

chat:
  local:
    enabled: true
    symbol: ""
    permission: "easychat.chat.local"
    radius: 100.0
    format: "&7[&fL&7] &f{player}&7: &r{message}"
  global:
    enabled: true
    symbol: "!"
    permission: "easychat.chat.global"
    radius: -1.0
    format: "&6[&eG&6] &f{player}&7: &r{message}"
  admin:
    enabled: true
    symbol: "%"
    permission: "easychat.chat.admin"
    format: "&c[ADMIN] &f{player}&7: &r{message}"
  cooldown:
    enabled: true
    seconds: 3
    bypass-permission: "easychat.bypass.cooldown"

moderation:
  bypass-permission: "easychat.bypass.mute"
  default-reason: "violation of the rules"
  self-unmute: false
  messages:
    muted: "&cYou are unable to send messages in chat: &f{reason}&c."
    muted-no-reason: "&cYou are unable to send messages in chat."
    no-permission: "&cYou do not have permission to use this chat."
    cooldown: "&cPlease wait &e{seconds}&c seconds."
    not-found: "&cPlayer not found."
    mute-created: "&aPlayer &f{player} &ahas been muted for &f{duration}&a. Reason: &f{reason}"
    unmuted: "&aPlayer &f{player} &ahas been unmuted."
    cannot-unmute: "&cYou cannot remove this mute: your weight is too low."
    already-muted: "&cThis player already has an active mute."

messages:
  reload: "&aEasyChat configuration has been reloaded."
  invalid-duration: "&cInvalid duration. Examples: 30s, 10m, 2h, 7d, perm"
  usage-mute: "&c/mute <player> <duration|perm> [reason]"
  usage-unmute: "&c/unmute <player>"
  usage-easychat: "&c/easychat reload"


  # This feature requires the Velocity plugin to be installed:
  # https://github.com/Pinkysha228/EasyChatBridge
network:
    # Forwards global/admin chat messages to other servers in the network
    # using the built-in BungeeCord forwarding channel through Velocity
    # (bungeecord:main -> Forward). No separate plugin is required on the
    # Velocity side. The servers only need to be connected to the same Velocity
    # proxy, and velocity.toml must allow plugin messaging.
    #
    # Any player-info-forwarding-mode is supported, including "modern".
    # The bungeecord:main channel is handled separately by the proxy and is
    # independent of the player forwarding mode.
  enabled: false

    # The name under which this server will be displayed in chat messages
    # forwarded to other servers. This value can be changed freely.
  server-name: "server"

    # Unique server ID used to prevent message echoing
    # (messages will not be forwarded back to their originating server).
    #
    # This value may be left empty. In that case, a random ID will be generated
    # on each server startup, which is sufficient for normal operation.
  server-id: ""

    # Format added before the standard channel format for messages
    # received from another server.
  tag-format: "&8[{server}]&r "

  forward:
    global: true
    admin: true

    # A shared secret used to authenticate messages between servers is stored
    # separately from this configuration file at:
    # plugins/EasyChat/network.secret
    #
    # When enabled: true is used for the first time, the file will be created
    # automatically. Manually copy the same secret to all other servers in
    # the network. The value must be identical on every server.

weights:
    # Fallback configuration for servers without LuckPerms.
    # Each entry uses the following format: permission -> weight.
  permissions:
    "easychat.weight.admin": 100
    "easychat.weight.moderator": 50
    "easychat.weight.helper": 10
  default: 0


discordsrv:
    # DiscordSRV is an optional soft dependency.
    # EasyChat uses its webhook API to forward Minecraft messages to Discord.
  webhook: true

    # DiscordSRV is an optional soft dependency.
    # If it is not installed, EasyChat will continue to function normally.
  enabled: true

    # EasyChat forwards its own chat messages because ChatListener cancels
    # the original Paper chat event.
  channels:
    local: false
    global: true
    admin: false

  format:
    local: "{player}: {message}"
    global: "{player}: {message}"
    admin: "[ADMIN] {player}: {message}"